packages:
  - "backend"
  - "frontend"

catalogs: {}

auditConfig:
  ignoreCves: []

# Reject packages published less than 7 days ago to reduce supply-chain attack risk.
# Value is in minutes: 7 days × 24 h × 60 min = 10080
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@oxfmt/binding-android-arm-eabi@0.71.0"
  - "@oxfmt/binding-android-arm64@0.71.0"
  - "@oxfmt/binding-darwin-arm64@0.71.0"
